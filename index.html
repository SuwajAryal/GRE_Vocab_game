<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRE Scholar — Lofi Study</title>
    <meta name="description" content="Calm paper-based GRE vocabulary flashcards for US PhD aspirants.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <!-- PWA / Mobile tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fdfbf7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GRE Lofi">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/university.png">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Lofi Background -->
    <div id="lofi-bg">
        <div class="lofi-overlay"></div>
    </div>

    <!-- App Container -->
    <div id="app">
        <!-- Floating Mascots -->
        <img src="mascot_lantern.png" alt="Magical Lantern" class="floating-mascot mascot-top-right">
        <img src="mascot_book.png" alt="Spell Book" class="floating-mascot mascot-bottom-right">

        <!-- Header -->
        <header id="main-header">
            <div class="header-content">
                <div class="brand">
                    <span class="brand-icon">🎓</span>
                    <h1 class="brand-title">GRE Scholar</h1>
                </div>
                
                <div class="group-selector-container">
                    <select id="group-select" onchange="changeGroup()">
                        <!-- Filled by JS -->
                    </select>
                </div>

                <div class="streak-container">
                    <span class="streak-flame">🔥</span>
                    <span id="streak-count">0</span>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <span id="progress-text" class="progress-text">0 / 30</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            <div id="flashcard-area" class="flashcard-area">
                <div id="flashcard" class="flashcard" onclick="flipCard()">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <span class="flashcard-label">Vocabulary</span>
                            <h2 id="flash-word" class="flash-word">Loading...</h2>
                            <p class="flash-hint">Tap to reveal definition</p>
                        </div>
                        <div class="flashcard-back">
                            <span class="flashcard-label">Definition</span>
                            <h3 id="flash-word-back" class="flash-word-back"></h3>
                            <p id="flash-definition" class="flash-definition"></p>
                            <p id="flash-example" class="flash-example"></p>
                        </div>
                    </div>
                </div>
                
                <div class="flashcard-controls">
                    <button class="control-btn" onclick="prevCard()" title="Previous word">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    
                    <div class="difficulty-controls">
                        <button class="btn btn-danger btn-circle" onclick="markWord('hard', event)" title="Hard">
                            <span>😓</span>
                        </button>
                        <button class="btn btn-success btn-circle" onclick="markWord('easy', event)" title="Easy">
                            <span>😎</span>
                        </button>
                    </div>

                    <button class="control-btn" onclick="nextCard()" title="Next word">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
                
                <div class="swipe-hint">Swipe to conquer your GRE</div>
            </div>
        </main>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="words.js"></script>
    <script src="app.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
